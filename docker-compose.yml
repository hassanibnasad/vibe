services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibeagent-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    networks:
      - vibeagent-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeagent-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=VibeAgent
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_SECRET_KEY=${APP_SECRET_KEY:-dev-secret-key-change-in-production-vibeagent}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-dev-webhook-secret-vibeagent}
      - APP_PORT=8000
      - DATABASE_URL=postgresql+asyncpg://vibeagent:vibeagent@postgres:5432/vibeagent
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - LITELLM_PROXY_URL=http://litellm:4000
      - LLM_MODEL_FAST=groq/llama-3.1-8b-instant
      - LLM_MODEL_PRIMARY=groq/llama-3.3-70b-versatile
      - LLM_EMBED_MODEL=all-minilm:l6-v2
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN:-}
      - HATCHET_HOST=${HATCHET_HOST:-}
    volumes:
      - ./backend/app:/app/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - vibeagent-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeagent-worker
    restart: unless-stopped
    # Override the default CMD (uvicorn) to run the Hatchet worker process.
    command: ["python", "worker.py"]
    environment:
      - APP_NAME=VibeAgent
      - APP_ENV=development
      - APP_DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://vibeagent:vibeagent@postgres:5432/vibeagent
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - LITELLM_PROXY_URL=http://litellm:4000
      - LLM_MODEL_FAST=groq/llama-3.1-8b-instant
      - LLM_MODEL_PRIMARY=groq/llama-3.3-70b-versatile
      - LLM_EMBED_MODEL=all-minilm:l6-v2
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      # Hatchet connection — required for the worker to register tasks and receive work.
      - HATCHET_CLIENT_TOKEN=${HATCHET_CLIENT_TOKEN:-}
      - HATCHET_HOST=${HATCHET_HOST:-}
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/worker.py:/app/worker.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    networks:
      - vibeagent-network

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: vibeagent-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    networks:
      - vibeagent-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: vibeagent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibeagent
      POSTGRES_PASSWORD: vibeagent
      POSTGRES_DB: vibeagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeagent -d vibeagent"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibeagent-network

  redis:
    image: redis:7.4-alpine
    container_name: vibeagent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vibeagent-network

  # Optional local Ollama container (uncomment if self-hosting weights locally)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: vibeagent-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollamadata:/root/.ollama
  #   networks:
  #     - vibeagent-network

volumes:
  pgdata:
  redisdata:

networks:
  vibeagent-network:
    driver: bridge
